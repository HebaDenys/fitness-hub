name: Android CI
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle-8.13-bin.zip
      - name: Test lint and build APK
        run: ./gradle-8.13/bin/gradle testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Rename APK
        if: success()
        run: cp app/build/outputs/apk/debug/app-debug.apk OpenHealthHub-v0.2.0-debug.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: OpenHealthHub-v0.2.0-debug
          path: OpenHealthHub-v0.2.0-debug.apk
          retention-days: 30
      - name: Publish rolling test release
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-latest --cleanup-tag -y || true
          gh release create test-latest OpenHealthHub-v0.2.0-debug.apk --target "$GITHUB_SHA" --title "Open Health Hub v0.2.0 Test" --notes "Automatic test build of Phase 1 + Phase 2. Debug APK for direct Android installation." --prerelease
