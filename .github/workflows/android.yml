name: Android CI

on:
  push:
  pull_request:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Prepare stable test signing key
        run: |
          base64 --decode ci/fitnesshub-test.jks.b64 > "$RUNNER_TEMP/fitnesshub-test.jks"
          keytool -list -keystore "$RUNNER_TEMP/fitnesshub-test.jks" -storepass fitnesshub -alias fitnesshubtest >/dev/null

      - name: Test lint and build APK
        env:
          FITNESS_HUB_TEST_KEYSTORE: ${{ runner.temp }}/fitnesshub-test.jks
          FITNESS_HUB_TEST_KEYSTORE_PASSWORD: fitnesshub
          FITNESS_HUB_TEST_KEY_ALIAS: fitnesshubtest
          FITNESS_HUB_TEST_KEY_PASSWORD: fitnesshub
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Extract version
        id: version
        run: echo "name=$(grep -oP 'versionName="\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        if: success()
        run: cp app/build/outputs/apk/debug/app-debug.apk FitnessHub-v${{ steps.version.outputs.name }}-debug.apk

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: FitnessHub-v${{ steps.version.outputs.name }}-debug
          path: FitnessHub-v${{ steps.version.outputs.name }}-debug.apk
          retention-days: 30

      - name: Publish rolling test release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-latest --cleanup-tag -y || true
          gh release create test-latest FitnessHub-v${{ steps.version.outputs.name }}-debug.apk --target "$GITHUB_SHA" --title "Fitness Hub v${{ steps.version.outputs.name }} Test" --notes "Automatic debug test build signed with the public Fitness Hub test key. Production signing is separate." --prerelease
