name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test CI certificate parser
        run: python3 -m unittest discover -s ci -p 'test_*.py' -v
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Prepare stable test signing key
        run: |
          base64 --decode ci/fitnesshub-test.jks.b64 > "$RUNNER_TEMP/fitnesshub-test.jks"
          keytool -list -keystore "$RUNNER_TEMP/fitnesshub-test.jks" -storepass fitnesshub -alias fitnesshubtest >/dev/null
      - name: Test lint and build APK
        env:
          FITNESS_HUB_TEST_KEYSTORE: ${{ runner.temp }}/fitnesshub-test.jks
          FITNESS_HUB_TEST_KEYSTORE_PASSWORD: fitnesshub
          FITNESS_HUB_TEST_KEY_ALIAS: fitnesshubtest
          FITNESS_HUB_TEST_KEY_PASSWORD: fitnesshub
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Summarize test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          paths = glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in paths:
              root = ET.parse(path).getroot()
              for name in totals:
                  totals[name] += int(root.get(name, 0))
          summary = f"JUnit results ({len(paths)} suites): {totals}" if paths else 'No JUnit XML results produced.'
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(summary + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports-${{ github.run_id }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 7
      - name: Package APK from build metadata
        id: version
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shutil
          directory = pathlib.Path('app/build/outputs/apk/debug')
          metadata = json.loads((directory / 'output-metadata.json').read_text())
          assert metadata['applicationId'] == 'io.github.hebadenys.fitnesshub'
          assert len(metadata['elements']) == 1, 'Expected one universal debug APK'
          artifact = metadata['elements'][0]
          version = artifact['versionName']
          assert re.fullmatch(r'[0-9A-Za-z.+-]+', version), 'Invalid APK version'
          apk = pathlib.Path(f'FitnessHub-v{version}-debug.apk')
          shutil.copyfile(directory / artifact['outputFile'], apk)
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          pathlib.Path(str(apk) + '.sha256').write_text(f'{digest}  {apk.name}\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'name={version}\napk={apk.name}\n')
          print(f'Packaged {apk.name}; versionCode={artifact["versionCode"]}; SHA256={digest}')
          PY
      - name: Verify APK signature and test certificate
        env:
          APK: ${{ steps.version.outputs.apk }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-signature.txt"
          EXPECTED=$(keytool -exportcert -keystore "$RUNNER_TEMP/fitnesshub-test.jks" -storepass fitnesshub -alias fitnesshubtest | sha256sum | cut -d ' ' -f1)
          python3 ci/verify_apk_certificate.py "$RUNNER_TEMP/apk-signature.txt" "$EXPECTED"
          sha256sum -c "$APK.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: FitnessHub-v${{ steps.version.outputs.name }}-debug
          path: |
            ${{ steps.version.outputs.apk }}
            ${{ steps.version.outputs.apk }}.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Publish rolling test release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.version.outputs.apk }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          if [ -f "docs/releases/$VERSION.md" ]; then
            cp "docs/releases/$VERSION.md" "$RUNNER_TEMP/release-notes.md"
          else
            printf '# Fitness Hub %s test build\n' "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          fi
          printf '\nBuild commit: `%s`\n' "$GITHUB_SHA" >> "$RUNNER_TEMP/release-notes.md"
          if gh release view test-latest >/dev/null 2>&1; then
            # Upload first. Do not delete the previous working release if publishing fails.
            gh release upload test-latest "$APK" "$APK.sha256" --clobber
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/test-latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit test-latest --target "$GITHUB_SHA" --title "Fitness Hub v$VERSION Test" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease
          else
            gh release create test-latest "$APK" "$APK.sha256" --target "$GITHUB_SHA" --title "Fitness Hub v$VERSION Test" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease
          fi
